name: Multilayer endpoint injectivity
on:
  push:
    paths:
      - 'experiments/multilayer_endpoint_injectivity.py'
      - 'docs/original_objective_contract.md'
      - '.github/workflows/multilayer-endpoint-injectivity.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust candidate dynamics
        run: python experiments/multilayer_endpoint_injectivity.py
