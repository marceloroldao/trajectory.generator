name: Nonlinear ablation

on:
  push:
    paths:
      - 'experiments/nonlinear_ablation.py'
      - 'experiments/nonlinear_ablation_perturbations.py'
      - 'experiments/nonlinear_term_ablation.py'
      - 'experiments/nonlinear_leave_one_out.py'
      - 'experiments/nonlinear_invariant_factorization.py'
      - 'experiments/nonlinear_two_channel_ablation.py'
      - 'experiments/two_channel_geometric_laws.py'
      - 'experiments/emergent_geometry_from_local_law.py'
      - 'experiments/local_admissibility_gate.py'
      - 'experiments/full_causal_emergence.py'
      - 'experiments/minimal_generative_coordinate.py'
      - 'experiments/generative_six_bit_law.py'
      - 'experiments/time_driven_generative_coordinate.py'
      - '.github/workflows/nonlinear-ablation.yml'
  workflow_dispatch:

jobs:
  ablate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Compare full and linear-only balanced universe
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_ablation.py
      - name: Compare nonlinear ablation across perturbed universes
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_ablation_perturbations.py
      - name: Exhaustively ablate nonlinear monomials
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_term_ablation.py
      - name: Leave-one-out nonlinear term analysis
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_leave_one_out.py
      - name: Factor nonlinear core into composite invariants
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_invariant_factorization.py
      - name: Ablate identity and geometry channels
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/nonlinear_two_channel_ablation.py
      - name: Derive I and G from geometric invariants
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/two_channel_geometric_laws.py
      - name: Grow universe from local I/G law only
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/emergent_geometry_from_local_law.py
      - name: Derive local admissibility gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/local_admissibility_gate.py
      - name: Regenerate operational universe in full causal state
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/full_causal_emergence.py
      - name: Search minimal raw generative coordinate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/minimal_generative_coordinate.py
      - name: Synthesize table-free six-bit generator
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/generative_six_bit_law.py
      - name: Minimize private state with public phase clock
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/time_driven_generative_coordinate.py
