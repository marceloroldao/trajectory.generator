name: General endpoint controllability
on:
  push:
    paths:
      - 'experiments/endpoint_controllability_general.py'
      - '.github/workflows/endpoint-controllability-general.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-capacity direct endpoint recovery
        run: python3 experiments/endpoint_controllability_general.py
