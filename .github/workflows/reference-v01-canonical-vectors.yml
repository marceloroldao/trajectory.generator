name: Reference v0.1 canonical vectors
on:
  push:
    paths:
      - 'experiments/reference_v01_canonical_vectors.py'
      - 'trajectory_generator/reference_v01.py'
      - '.github/workflows/reference-v01-canonical-vectors.yml'
jobs:
  emit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit canonical vectors
        env:
          PYTHONPATH: .
        run: python experiments/reference_v01_canonical_vectors.py
