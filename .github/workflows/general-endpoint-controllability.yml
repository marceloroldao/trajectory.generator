name: General endpoint controllability
on:
  push:
    paths:
      - 'experiments/general_endpoint_controllability.py'
      - '.github/workflows/general-endpoint-controllability.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate systematic endpoint-only family
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python experiments/general_endpoint_controllability.py
