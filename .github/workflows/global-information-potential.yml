name: global-information-potential

on:
  push:
    branches: [ main ]
    paths:
      - 'experiments/global_information_potential.py'
      - 'experiments/recurrent_orbit_core.py'
      - 'experiments/topological_transition_state.py'
      - '.github/workflows/global-information-potential.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run global potential diagnostic
        run: python experiments/global_information_potential.py
