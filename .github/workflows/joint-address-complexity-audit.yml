name: Joint address complexity audit
on:
  push:
    paths:
      - 'experiments/joint_address_complexity_audit.py'
      - '.github/workflows/joint-address-complexity-audit.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit joint address structural complexity
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/joint_address_complexity_audit.py
