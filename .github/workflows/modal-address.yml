name: Modal horizon-free address

on:
  push:
    paths:
      - 'experiments/modal_horizon_free_address.py'
      - '.github/workflows/modal-address.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate three-amplitude public field and address codec
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/modal_horizon_free_address.py
