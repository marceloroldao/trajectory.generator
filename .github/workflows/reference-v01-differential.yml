name: Reference v0.1 differential

on:
  push:
    paths:
      - 'trajectory_generator/reference_v01.py'
      - 'tests/test_reference_v01_differential.py'
      - 'experiments/joint_dyadic_address.py'
      - 'experiments/dyadic_online_forest.py'
      - 'experiments/standalone_four_bit_codec.py'
      - '.github/workflows/reference-v01-differential.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Differential validation
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python -m pytest -q tests/test_reference_v01_differential.py
