name: reversible-pipeline-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reversible-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reversible codec unit gates
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v             tests.test_algebraic_root_trajectory             tests.test_streaming_colex_trajectory             tests.test_weighted_path_trajectory             tests.test_recurrent_macrograph             tests.test_public_graph_trajectory             tests.test_count_field_recurrence

      - name: Run automatic recurrent-core gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/automatic_endogenous_pipeline_gate.py

      - name: Run full-universe streaming gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/full_universe_streaming_codec.py

      - name: Run fixed-memory count-field gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/count_field_recurrence_gate.py

      - name: Run Floquet count-field compression gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/floquet_count_field_gate.py

      - name: Run affine translation address gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/translation_address_gate.py

      - name: Run scalar partition reverse gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/scalar_partition_gate.py

      - name: Run final-state-only end-to-end gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/final_state_only_gate.py
