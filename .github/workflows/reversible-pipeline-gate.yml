name: reversible-pipeline-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reversible-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reversible codec unit gates
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v \
            tests.test_algebraic_root_trajectory \
            tests.test_streaming_colex_trajectory \
            tests.test_weighted_path_trajectory \
            tests.test_recurrent_macrograph \
            tests.test_public_graph_trajectory \
            tests.test_count_field_recurrence \
            tests.test_floquet_count_field \
            tests.test_translation_address_trajectory \
            tests.test_scalar_partition_trajectory \
            tests.test_seeded_graph_state_machine \
            tests.test_reversible_fiber_lift \
            tests.test_lifted_causal_universe \
            tests.test_endogenous_vertical_dynamics \
            tests.test_canonical_vertical_law \
            tests.test_canonical_vertical_state_machine \
            tests.test_minimal_reversible_completion \
            tests.test_reversible_natural_extension \
            tests.test_intrinsic_vertical_dynamics \
            tests.test_vertical_gauge_symmetry \
            tests.test_branch_reflection_vertical_dynamics \
            tests.test_gauge_invariant_vertical_law \
            tests.test_reversible_completion_groupoid \
            tests.test_gauge_covariant_vertical_event \
            tests.test_cyclic_fiber_functor \
            tests.test_history_naturality_no_go \
            tests.test_stationary_reversible_cover_no_go \
            tests.test_branch_information_budget \
            tests.test_vertical_conjugacy_class

      - name: Run automatic recurrent-core gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/automatic_endogenous_pipeline_gate.py

      - name: Run full-universe streaming gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/full_universe_streaming_codec.py

      - name: Run fixed-memory count-field gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/count_field_recurrence_gate.py

      - name: Run Floquet count-field compression gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/floquet_count_field_gate.py

      - name: Run affine translation address gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/translation_address_gate.py

      - name: Run scalar partition reverse gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/scalar_partition_gate.py

      - name: Run final-state-only end-to-end gate
        env:
          PYTHONPATH: .
        run: |
          python experiments/final_state_only_gate.py

      - name: Quantify raw causal-state information gap
        env:
          PYTHONPATH: .
        run: |
          python experiments/causal_state_information_gap.py

      - name: Gate reversible causal fiber lift
        env:
          PYTHONPATH: .
        run: |
          python experiments/reversible_fiber_lift_gate.py

      - name: Gate minimal reversible causal lift
        env:
          PYTHONPATH: .
        run: |
          python experiments/minimal_reversible_causal_lift_gate.py

      - name: Gate endogenous periodic vertical dynamics
        env:
          PYTHONPATH: .
        run: |
          python experiments/endogenous_vertical_dynamics_gate.py

      - name: Search minimal canonical vertical law
        env:
          PYTHONPATH: .
        run: |
          python experiments/canonical_vertical_law_search.py

      - name: Gate canonical vertical final-state machine
        env:
          PYTHONPATH: .
        run: |
          python experiments/canonical_vertical_final_state_gate.py

      - name: Gate general minimal reversible completion
        env:
          PYTHONPATH: .
        run: |
          python experiments/general_reversible_completion_gate.py

      - name: Gate natural-extension gauge conjugacy
        env:
          PYTHONPATH: .
        run: |
          python experiments/natural_extension_gauge_gate.py

      - name: Gate phase-reflection final-state recovery
        env:
          PYTHONPATH: .
        run: |
          python experiments/phase_reflection_final_state_gate.py

      - name: Gate vertical gauge automorphism symmetry
        env:
          PYTHONPATH: .
        run: |
          python experiments/vertical_gauge_automorphism_gate.py

      - name: Gate information-event vertical reflection
        env:
          PYTHONPATH: .
        run: |
          python experiments/branch_reflection_vertical_gate.py

      - name: Gate gauge-invariant vertical no-go theorem
        env:
          PYTHONPATH: .
        run: |
          python experiments/gauge_invariance_no_go_gate.py

      - name: Gate reversible completion gauge groupoid
        env:
          PYTHONPATH: .
        run: |
          python experiments/reversible_completion_groupoid_gate.py

      - name: Gate topological final-state gauge equivalence
        env:
          PYTHONPATH: .
        run: |
          python experiments/topological_gauge_equivalence_gate.py

      - name: Gate gauge-invariant vertical conjugacy classes
        env:
          PYTHONPATH: .
        run: |
          python experiments/vertical_conjugacy_class_gate.py

      - name: Gate cyclic fiber inversion naturality
        env:
          PYTHONPATH: .
        run: |
          python experiments/cyclic_fiber_naturality_gate.py

      - name: Gate cyclic fiber origin no-go theorem
        env:
          PYTHONPATH: .
        run: |
          python experiments/fiber_group_structure_no_go_gate.py

      - name: Gate gauge-covariant information-event dynamics
        env:
          PYTHONPATH: .
        run: |
          python experiments/gauge_covariant_vertical_event_gate.py

      - name: Gate symbol-induced canonical fiber structure
        env:
          PYTHONPATH: .
        run: |
          python experiments/symbolic_fiber_structure_gate.py

      - name: Gate cyclic fiber functor compatibility
        env:
          PYTHONPATH: .
        run: |
          python experiments/cyclic_fiber_functor_gate.py

      - name: Gate history naturality no-go theorem
        env:
          PYTHONPATH: .
        run: |
          python experiments/history_naturality_no_go_gate.py

      - name: Gate stationary reversible-cover no-go theorem
        env:
          PYTHONPATH: .
        run: |
          python experiments/stationary_reversible_cover_no_go_gate.py

      - name: Gate native vertical product tradeoff
        env:
          PYTHONPATH: .
        run: |
          python experiments/native_vertical_product_gate.py

      - name: Gate branch-created information budget
        env:
          PYTHONPATH: .
        run: |
          python experiments/branch_information_budget_gate.py

      - name: Gate horizontal vertical entropy flow
        env:
          PYTHONPATH: .
        run: |
          python experiments/horizontal_vertical_entropy_gate.py

      - name: Gate asymptotic vertical information dominance
        env:
          PYTHONPATH: .
        run: |
          python experiments/vertical_dominance_gate.py

      - name: Gate vertical entropy rate against topological entropy
        env:
          PYTHONPATH: .
        run: |
          python experiments/vertical_entropy_rate_gate.py

      - name: Gate information clock against vertical memory rate
        env:
          PYTHONPATH: .
        run: |
          python experiments/information_clock_vertical_rate_gate.py

      - name: Gate horizontal vertical fiber-bundle geometry
        env:
          PYTHONPATH: .
        run: |
          python experiments/fiber_bundle_geometry_gate.py

      - name: Gate normalized vertical reverse-Parry geometry
        env:
          PYTHONPATH: .
        run: |
          python experiments/normalized_vertical_dynamics_gate.py

      - name: Gate exact local horizontal vertical connection
        env:
          PYTHONPATH: .
        run: |
          python experiments/exact_vertical_connection_gate.py
