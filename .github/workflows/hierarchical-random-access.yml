name: Hierarchical random access

on:
  push:
    paths:
      - 'experiments/hierarchical_random_access_address.py'
      - 'experiments/logtime_scalar_public_field.py'
      - 'experiments/standalone_four_bit_codec.py'
      - '.github/workflows/hierarchical-random-access.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate hierarchical rank and direct z_k access
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/hierarchical_random_access_address.py
