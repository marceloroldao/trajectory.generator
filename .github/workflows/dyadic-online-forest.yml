name: Dyadic online forest
on:
  push:
    paths:
      - 'experiments/dyadic_online_forest.py'
      - '.github/workflows/dyadic-online-forest.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate online dyadic forest and random access
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/dyadic_online_forest.py
