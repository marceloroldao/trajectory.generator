name: Local causal coordinate

on:
  push:
    paths:
      - 'experiments/local_causal_coordinate.py'
      - 'experiments/local_causal_reversibility.py'
      - 'experiments/binary_reversible_edge_label.py'
      - 'experiments/causal_label_codec.py'
      - 'experiments/local_label_formula_search.py'
      - 'experiments/minimal_local_label_variables.py'
      - 'experiments/geometric_invariant_label_search.py'
      - 'experiments/minimal_geometric_state.py'
      - 'experiments/compact_geometric_coordinate.py'
      - 'experiments/causal_coordinate_refinement.py'
      - 'experiments/basin_potential_coordinate.py'
      - '.github/workflows/local-causal-coordinate.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Test local causal closure
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/local_causal_coordinate.py
      - name: Test bidirectional local reversibility
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/local_causal_reversibility.py
      - name: Construct binary reversible edge label
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/binary_reversible_edge_label.py
      - name: Validate causal binary label codec
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/causal_label_codec.py
      - name: Search local reversible-label formula
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/local_label_formula_search.py
      - name: Minimize local reversible-label variables
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/minimal_local_label_variables.py
      - name: Search geometric invariants
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/geometric_invariant_label_search.py
      - name: Derive minimal reversible geometric state
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/minimal_geometric_state.py
      - name: Search compact six-bit geometric coordinate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/compact_geometric_coordinate.py
