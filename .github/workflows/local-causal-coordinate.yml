name: Local causal coordinate

on:
  push:
    paths:
      - 'experiments/local_causal_coordinate.py'
      - 'experiments/causal_coordinate_refinement.py'
      - 'experiments/basin_potential_coordinate.py'
      - '.github/workflows/local-causal-coordinate.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Test local causal closure
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments
        run: python experiments/local_causal_coordinate.py
